# Builds the site and publishes it to GitHub Pages.
name: Deploy

# Only when something lands on main (i.e. after a PR is merged).
# workflow_dispatch adds a manual "Run workflow" button in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys need to write to Pages and prove who they are (id-token).
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer one waits instead of cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Tells GitHub this repo publishes to Pages.
      - uses: actions/configure-pages@v6
      # Packs the built dist/ folder as the site to publish.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Waits for the build job to succeed first.
    needs: build
    runs-on: ubuntu-latest
    # Shows the live URL on the repo page under "Environments".
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publishes the packed site.
      - id: deployment
        uses: actions/deploy-pages@v5
