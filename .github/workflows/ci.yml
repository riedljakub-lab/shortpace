# CI = "continuous integration": checks every change before it can reach main.
name: CI

# When to run: on every pull request, and on every push to any branch.
on:
  pull_request:
  push:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    # A fresh Linux machine from GitHub, thrown away afterwards.
    runs-on: ubuntu-latest
    steps:
      # 1. Download the repo's code onto the machine.
      - uses: actions/checkout@v7

      # 2. Install the Node version from .nvmrc, and cache npm downloads between runs.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # 3. Install the exact versions from package-lock.json (clean, reproducible).
      - run: npm ci

      # 4. The three gates. If any fails, the check turns red and merging is blocked.
      - run: npm run lint
      - run: npm test
      - run: npm run build
